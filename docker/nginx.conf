server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/lms-secrets/web.crt;
    ssl_certificate_key /run/lms-secrets/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        client_max_body_size 0; # API enforces the configurable limit and returns Problem Details.
        proxy_request_buffering off;
        proxy_pass https://api:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name api;
        proxy_ssl_trusted_certificate /run/lms-secrets/ca.crt;
        proxy_ssl_verify on;
        proxy_set_header Host $http_host;
        proxy_intercept_errors off;
    }
    location = /health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
    location = /index.html { internal; }
    location /assets/ { try_files $uri =404; }
    location = /local-auth.js { try_files $uri =404; }
    location = /local-login.html { try_files $uri =404; }
    location = /${ADMIN_ENTRY_UUID} {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        default_type text/html;
        alias /usr/share/nginx/html/index.html;
    }
    location = / { try_files $uri /index.html; }
    location ~ ^/(login|select-organization|courses(?:/.*)?|study/courses(?:/.*)?|problem-assignments(?:/.*)?|progress|teacher/review-history|teacher/reviews(?:/.*)?)$ {
        try_files $uri /index.html;
    }
    location / { return 404; }
}
